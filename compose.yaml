# Digest-pinned services for the M2/M3 backends. Every service runs with the
# same CPU and memory limits so cross-system numbers are comparable; override
# BENCHMARK_CPU_LIMIT / BENCHMARK_MEMORY_LIMIT_BYTES to change the budget for
# every service at once, never for one.
name: adversarial-graph

x-limits: &limits
  cpus: "${BENCHMARK_CPU_LIMIT:-8}"
  mem_limit: "${BENCHMARK_MEMORY_LIMIT_BYTES:-6442450944}"
  memswap_limit: "${BENCHMARK_MEMORY_LIMIT_BYTES:-6442450944}"

services:
  postgres:
    <<: *limits
    image: "${POSTGRES_IMAGE:-postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af}"
    environment:
      POSTGRES_DB: graph
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graph"]
      interval: 1s
      timeout: 3s
      retries: 60
    shm_size: 512mb
    ports: ["15432:5432"]

  # FalkorDB's image defaults to RESULTSET_SIZE 10000, which silently truncates
  # every result set at 10,000 rows (no error, no warning). The defaults
  # profile keeps that so the truncation is measured (it trips the
  # wrong_answer gate on wiki-Talk's 12,215-neighbour hub); the tuned profile
  # lifts it with the documented knob. FALKOR_RESULTSET_SIZE=-1 selects tuned.
  falkor:
    <<: *limits
    image: "${FALKOR_IMAGE:-falkordb/falkordb:v4.20.4@sha256:adbddd418916c25618564ff8597a919b08bc76452ebeb74eb985c38d7281df62}"
    environment:
      FALKORDB_ARGS: "RESULTSET_SIZE ${FALKOR_RESULTSET_SIZE:-10000}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60
    ports: ["16379:6379"]

  surreal:
    <<: *limits
    image: "${SURREAL_IMAGE:-surrealdb/surrealdb:v3.2.4@sha256:51baed8709f57f67dcf04b30e3177db846803fa9342dae2be58c6fa5f8d59843}"
    command: ["start", "--log", "warn", "--user", "root", "--pass", "root", "memory"]
    ports: ["18000:8000"]

  # HelixDB (Rust). The digest is the multi-arch image index of the same
  # enterprise-dev build the sibling LSQB harness runs (its arm64 member is
  # sha256:931be787…, the laptop's original pin; amd64 is sha256:f9cf2988…),
  # so the pin resolves on both Apple Silicon and x86 hosts. Serves dynamic
  # queries on /v1/query; the harness's helix-http backend points here.
  helix:
    <<: *limits
    image: "${HELIX_IMAGE:-ghcr.io/helixdb/enterprise-dev@sha256:c6f9847b60597687ef4674ba9ed7ca5ae230d84dc380a593f6310f7eb51a4588}"
    ports: ["18082:8080"]

  # The server for the helix-sdk backend: `helix-db` 3.0.0 posts a nested
  # query AST to /v2/query, which the enterprise-dev image above does not
  # serve (it answers 400 "missing field `queries`" to every SDK request).
  # This is the standalone HelixDB server at the revision the SDK grew up
  # with, built from source on the host by scripts/build-helix-sdk-server.sh
  # (there is no registry image); the harness records the image ID it ran
  # against. Memory storage under the same limits as every other service.
  helix-sdk:
    <<: *limits
    image: "${HELIX_SDK_IMAGE:-ag-helix-sdk-server:0ef3cee0}"
    ports: ["18083:8080"]

  pggraph:
    <<: *limits
    image: "${PGGRAPH_IMAGE:-ghcr.io/evokoa/pggraph:1.2.0}"
    environment:
      POSTGRES_DB: graph
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports: ["55433:5432"]

  # External comparison targets (M3). Memory tuning is applied from the
  # vendor's own recommendation for the container budget and recorded in the
  # run bundle; see ADVERSARIAL-GRAPH.md §3.6.
  # Neo4j Community over Bolt. Memory follows the vendor's own rule for a
  # fixed container budget: heap + page cache must leave room for the JVM's
  # native memory and the OS. In the 6 GiB budget that is 2G + 2G with 2G of
  # headroom; the earlier 3G + 3G summed to the whole budget and Docker
  # OOM-killed the container the first time the store outgrew the page cache
  # (soc-LiveJournal1, 69 M edges). The transaction memory cap is the
  # documented guard against unbounded MATCH results. Values are recorded in
  # each run bundle.
  neo4j:
    <<: *limits
    image: "${NEO4J_IMAGE:-neo4j:5.26-community}"
    environment:
      NEO4J_AUTH: neo4j/adversarial
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
      NEO4J_db_memory_transaction_total_max: "${NEO4J_TXN_MAX:-1G}"
      NEO4J_dbms_security_procedures_unrestricted: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 60
    ports: ["17687:7687", "17474:7474"]
    profiles: ["external"]

  # Apache AGE: openCypher as a PostgreSQL extension. The harness talks to
  # it over the PostgreSQL wire protocol through AGE's cypher() function.
  age:
    <<: *limits
    image: "${AGE_IMAGE:-apache/age:release_PG18_1.8.0}"
    environment:
      POSTGRES_DB: graph
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graph"]
      interval: 1s
      timeout: 3s
      retries: 60
    shm_size: 512mb
    ports: ["55434:5432"]
    profiles: ["external"]

  memgraph:
    <<: *limits
    image: "${MEMGRAPH_IMAGE:-memgraph/memgraph:3.12.0}"
    # Memgraph's own limit sits under the container budget so the process's
    # overhead never pushes the container past it.
    command: ["--memory-limit=${MEMGRAPH_MEMORY_MB:-5120}", "--log-level=WARNING"]
    ports: ["17688:7687"]
    profiles: ["external"]
