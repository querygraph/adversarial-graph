[package]
name = "adversarial-graph"
version = "0.1.0"
edition = "2024"
publish = false
description = "GRAPH-ADVERSARIAL-v1: an adversarial benchmark harness for every Grust backend and the QueryGraph stack"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ag"
path = "src/main.rs"

[dependencies]
grust = { package = "grust-graph", git = "https://github.com/querygraph/grust", rev = "2b6e536ab8d980613e2462a759b732493ddf08dc", features = ["memory", "turso", "cypher"] }
# Every Grust crate comes from one git revision of github.com/querygraph/grust,
# never from crates.io and never from a local checkout: the facade, the Cypher
# crate, the PostgreSQL core, and the internal backends that are not published
# (`publish = false`). One source means one `grust-core` and one `GraphStore`
# trait. (Until 2026-09-13 the facade came from crates.io at 0.13 with the
# internals patched to git; when Grust main moved to 0.14 the patches stopped
# applying and the build silently mixed crates.io 0.13 code with git code.)
grust-helix = { git = "https://github.com/querygraph/grust", rev = "2b6e536ab8d980613e2462a759b732493ddf08dc", optional = true }
grust-ladybug = { git = "https://github.com/querygraph/grust", rev = "2b6e536ab8d980613e2462a759b732493ddf08dc", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
hdrhistogram = "7"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
redis = { version = "1", optional = true }
neo4rs = { version = "0.8", optional = true }
tokio-postgres = { version = "0.7", optional = true }
bytes = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
# The Helix SDK client itself, for the id index the helix-sdk bootstrap
# creates on its own server (the v1 JSON below is for the other one).
helix-db = { version = "=3.0.0", optional = true }
async-trait = { version = "0.1", optional = true }
csv = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
grust-cypher = { git = "https://github.com/querygraph/grust", rev = "2b6e536ab8d980613e2462a759b732493ddf08dc" }
grust-postgres-core = { git = "https://github.com/querygraph/grust", rev = "2b6e536ab8d980613e2462a759b732493ddf08dc", optional = true }

[features]
default = []
postgres = ["grust/postgres", "dep:grust-postgres-core"]
postgres-pgq = ["grust/postgres-pgq"]
pggraph = ["grust/pggraph"]
surreal = ["grust/surreal"]
falkor = ["grust/falkor", "dep:redis"]
lancedb = ["grust/lancedb"]
sail = ["grust/sail"]
helix = ["dep:grust-helix", "dep:reqwest", "dep:helix-db"]
ladybug = ["dep:grust-ladybug"]
neo4j = ["dep:neo4rs", "dep:reqwest", "dep:async-trait"]
age = ["dep:tokio-postgres", "dep:bytes", "dep:async-trait"]
full-backends = ["postgres", "postgres-pgq", "pggraph", "surreal", "falkor", "lancedb", "sail", "helix", "ladybug", "neo4j", "age"]

[profile.release]
debug = 0

[dev-dependencies]
tempfile = "3"
