[package]
name = "adversarial-graph"
version = "0.1.0"
edition = "2024"
publish = false
description = "GRAPH-ADVERSARIAL-v1: an adversarial benchmark harness for every Grust backend and the QueryGraph stack"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ag"
path = "src/main.rs"

[dependencies]
grust = { package = "grust-graph", version = "0.13.0", features = ["memory", "turso", "cypher"] }
# Internal Grust backends that are deliberately not on crates.io
# (`publish = false`): pinned to one published Grust revision (the
# `fable/strain-adapter-reads` branch head, on top of v0.13.1) so the harness
# still never depends on a local Grust checkout.
grust-helix = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149", optional = true }
grust-ladybug = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
hdrhistogram = "7"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
redis = { version = "1", optional = true }
neo4rs = { version = "0.8", optional = true }
tokio-postgres = { version = "0.7", optional = true }
bytes = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
# The Helix SDK client itself, for the id index the helix-sdk bootstrap
# creates on its own server (the v1 JSON below is for the other one).
helix-db = { version = "=3.0.0", optional = true }
async-trait = { version = "0.1", optional = true }
csv = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
grust-cypher = "0.13"
grust-postgres-core = { version = "0.13", optional = true }

[features]
default = []
postgres = ["grust/postgres", "dep:grust-postgres-core"]
postgres-pgq = ["grust/postgres-pgq"]
pggraph = ["grust/pggraph"]
surreal = ["grust/surreal"]
falkor = ["grust/falkor", "dep:redis"]
lancedb = ["grust/lancedb"]
sail = ["grust/sail"]
helix = ["dep:grust-helix", "dep:reqwest", "dep:helix-db"]
ladybug = ["dep:grust-ladybug"]
neo4j = ["dep:neo4rs", "dep:reqwest", "dep:async-trait"]
age = ["dep:tokio-postgres", "dep:bytes", "dep:async-trait"]
full-backends = ["postgres", "postgres-pgq", "pggraph", "surreal", "falkor", "lancedb", "sail", "helix", "ladybug", "neo4j", "age"]

# The git-pinned internal backends carry `grust-core` as a path dependency
# inside the Grust workspace; this makes the registry `grust-core 0.13.0` the
# published `grust-graph` uses resolve to the identical pinned source so both
# sides share one `GraphStore` trait. `grust-memory` and `grust-turso` are
# pinned to the same revision for the store changes measured in
# ADVERSARIAL-GRAPH.md §7.2, ahead of their crates.io release.
[patch.crates-io]
grust-core = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149" }
grust-memory = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149" }
grust-turso = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149" }
grust-cypher = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149" }
grust-postgres-core = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149" }
# The LanceDB adapter is pinned here too: the published grust-graph would
# otherwise resolve grust-lancedb from the registry, and one grust-core must
# serve both sides (FABLE-TO-FABLE §38).
grust-lancedb = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149" }
# And the Surreal adapter: until 2d447ff the published grust-graph resolved
# grust-surreal 0.13.0 from the registry, so every surreal-http/surreal-sdk
# row before 2026-09-11 ran the crates.io adapter, not the pin. The
# relation-endpoint index, the direct record reads and the request timeout
# are in the pinned source (git 0.13.1 satisfies the facade's ^0.13.0).
grust-surreal = { git = "https://github.com/querygraph/grust", rev = "1de21d512d8f152c474f9d14327eedc9b7fa2149" }

[profile.release]
debug = 0

[dev-dependencies]
tempfile = "3"
